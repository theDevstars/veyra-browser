name: Veyra native and desktop builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veyra-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  config-check:
    name: Check Expo native configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx expo config --type public

  windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Veyra Browser installer
        working-directory: desktop
        run: |
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Veyra-Windows-Installer
          path: desktop/dist/*.exe
          if-no-files-found: error

  mobile:
    name: Build iOS IPA and Android APK
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require Expo build credentials
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add EXPO_TOKEN in GitHub repository Actions secrets before starting mobile builds."
            exit 1
          fi
      - run: npm install
      - name: Build iOS IPA and Android APK
        run: npx eas-cli build --platform all --profile preview --non-interactive
