<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veyra Browser</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10101a;color:#f7f5ff;font:14px Inter,Segoe UI,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
main{flex:1;min-height:0;display:flex;flex-direction:column}.brandbar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #302c45;background:#171525}.brand{font-size:23px;font-weight:800;letter-spacing:.7px}.brand span{color:#9b8cff}.brand small{display:block;color:#9385ef;font-size:8px;letter-spacing:4px;margin-top:-2px}
#start{flex:1;display:grid;place-items:center;text-align:center;padding:32px}.welcome h1{font-size:46px;margin:0 0 12px}.welcome p{color:#aaa5c2;font-size:16px}.mark{width:78px;height:78px;border-radius:24px;background:#292443;border:1px solid #51477d;display:grid;place-items:center;color:#a9a0ff;font-size:51px;font-weight:800;margin:0 auto 24px}.tiles{display:flex;gap:12px;justify-content:center;margin-top:30px}.tile{padding:18px 22px;border:1px solid #39344f;border-radius:16px;background:#1b192b;color:#c9c3e4;min-width:150px}
#view{flex:1;display:none;border:0;background:white;width:100%;height:100%}.dock{padding:13px 18px 10px;background:#171525;border-top:1px solid #302c45;display:flex;flex-direction:column;gap:10px}.address{height:48px;max-width:980px;width:100%;margin:auto;display:flex;align-items:center;background:#242238;border:1px solid #494365;border-radius:15px;padding:4px 5px 4px 14px;gap:8px}.address input{flex:1;min-width:80px;background:transparent;border:0;outline:0;color:white;padding:8px 5px;font-size:14px}.address input::placeholder{color:#88849d}.address button{background:#8170f5;color:#fff;font-weight:700;padding:10px 19px;border:0;border-radius:11px;cursor:pointer}
.controls{display:flex;justify-content:center;gap:32px;align-items:center}.controls button,.topAction{width:42px;height:38px;border:0;border-radius:12px;background:transparent;color:#d8d4ef;cursor:pointer;font-size:20px}.controls button:hover,.topAction:hover{background:#29263d}.controls svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
#panel{display:none;flex:1;overflow:auto;padding:30px max(24px,calc((100% - 760px)/2));}.panelhead{margin-bottom:20px}.back{border:0;background:none;color:#a99dfb;cursor:pointer;font-size:14px;padding:0 0 16px}.panelhead h1{font-size:30px;margin:0}.row{display:flex;align-items:center;gap:16px;padding:19px 0;border-bottom:1px solid #2b283d;cursor:pointer}.row strong{display:block}.row small{display:block;color:#8f8aa8;margin-top:5px}.row .ico{width:42px;height:42px;border-radius:13px;background:#282442;color:#9b8cff;display:grid;place-items:center;font-size:20px}.row .arrow{margin-left:auto;color:#77718e;font-size:25px}.savedlink{color:#f0edff;text-align:left;flex:1;min-width:0;background:none;border:0;cursor:pointer}.savedlink small{display:block;color:#8f8aa8;overflow:hidden;text-overflow:ellipsis}.toggle{margin-left:auto;accent-color:#8170f5;width:18px;height:18px}.note{background:#1b192b;border:1px solid #39344f;padding:18px;border-radius:15px;color:#aaa5c2;line-height:1.6}
.status{height:23px;padding:4px 14px;color:#77728e;font-size:11px;background:#171525}
@media(max-width:650px){.tiles{flex-direction:column}.welcome h1{font-size:34px}.controls{gap:10px}.dock{padding:10px}.brandbar{height:50px}}
</style></head><body>
<div class="brandbar"><div class="brand">Veyra<span>.</span><small>BROWSER</small></div></div>
<main><div id="start"><div class="welcome"><div class="mark">V</div><h1>Browse your way.</h1><p>A calmer space for everything online.</p><div class="tiles"><div class="tile">Private by design</div><div class="tile">Your web, your way</div><div class="tile">Veyra Browser</div></div></div></div>
<div id="panel"></div><webview id="view" partition="persist:veyra" allowpopups></webview></main>
<div class="dock"><div class="address"><input id="url" placeholder="Search or enter address" autocomplete="off" spellcheck="false"><button id="go">Go</button></div><div class="controls">
<button id="back" title="Back"><svg viewBox="0 0 24 24"><path d="M19 12H5m7 7-7-7 7-7"/></svg></button>
<button id="forward" title="Forward"><svg viewBox="0 0 24 24"><path d="M5 12h14m-7-7 7 7-7 7"/></svg></button>
<button id="reload" title="Reload"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4.8 16A8 8 0 0 0 19 12M4 17v-5h5M19.2 8A8 8 0 0 0 5 12"/></svg></button>
<button id="home" title="Home"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/></svg></button>
<button id="savedBtn" title="Saved pages"><svg viewBox="0 0 24 24"><path d="M6 4.8A1.8 1.8 0 0 1 7.8 3h8.4A1.8 1.8 0 0 1 18 4.8V21l-6-4-6 4z"/></svg></button>
<button id="settingsBtn" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="m19.4 13.5 1.1.9-1.1 1.9-1.4-.5a7.8 7.8 0 0 1-1.5.9l-.2 1.5h-2.2l-.4-1.4a7.8 7.8 0 0 1-1.8 0l-.8 1.2-1.9-1.1.5-1.4a7.8 7.8 0 0 1-.9-1.5l-1.5-.2v-2.2l1.4-.4a7.8 7.8 0 0 1 0-1.8l-1.2-.8 1.1-1.9 1.4.5a7.8 7.8 0 0 1 1.5-.9l.2-1.5h2.2l.4 1.4a7.8 7.8 0 0 1 1.8 0l.8-1.2 1.9 1.1-.5 1.4a7.8 7.8 0 0 1 .9 1.5l1.5.2v2.2l-1.4.4a7.8 7.8 0 0 1 0 1.8Z"/></svg></button>
</div></div><div class="status" id="status">Veyra Browser · Windows desktop</div>
<script>
const view=document.getElementById('view'),start=document.getElementById('start'),panel=document.getElementById('panel'),input=document.getElementById('url'),status=document.getElementById('status');
let saved=[];try{saved=JSON.parse(localStorage.getItem('veyra:saved')||'[]')}catch{}
function navigate(){let v=input.value.trim();if(!v)return;let target=/^https?:\/\//i.test(v)?v:/^[^\s.]+$/.test(v)?'https://www.google.com/search?q='+encodeURIComponent(v):'https://'+v;panel.style.display='none';start.style.display='none';view.style.display='block';view.src=target;status.textContent='Loading '+target}
function home(){view.src='about:blank';view.style.display='none';panel.style.display='none';start.style.display='grid';input.value='';status.textContent='Veyra Browser · Windows desktop'}
function showPanel(title,body){view.style.display='none';start.style.display='none';panel.style.display='block';panel.innerHTML='<div class="panelhead"><button class="back" id="panelBack">‹ Home</button><h1>'+title+'</h1></div>'+body;document.getElementById('panelBack').onclick=home}
function showSaved(){const rows=saved.length?saved.map((x,i)=>'<div class="row"><span class="ico">♧</span><button class="savedlink" data-open="'+i+'"><strong>'+x.title+'</strong><small>'+x.url+'</small></button><button class="topAction" data-remove="'+i+'">×</button></div>').join(''):'<p class="note">Pages you save will appear here.</p>';showPanel('Saved pages',rows);panel.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>navigate(saved[+b.dataset.open].url));panel.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{saved.splice(+b.dataset.remove,1);localStorage.setItem('veyra:saved',JSON.stringify(saved));showSaved()})}
function showSettings(section='main'){const menus={main:'<div class="row" data-section="customization"><span class="ico">◈</span><div><strong>Customization</strong><small>Theme and browser appearance</small></div><span class="arrow">›</span></div><div class="row" data-section="security"><span class="ico">◇</span><div><strong>Security & privacy</strong><small>Cookies, tracking and site controls</small></div><span class="arrow">›</span></div><div class="row" data-section="extensions"><span class="ico">＋</span><div><strong>Extensions</strong><small>Extension support and management</small></div><span class="arrow">›</span></div>',
customization:'<div class="row"><div><strong>Dark appearance</strong><small>Use Veyra’s dark theme</small></div><input class="toggle" type="checkbox" checked></div>',
security:'<div class="row"><div><strong>Limit third-party cookies</strong><small>Restricts third-party cookies where supported</small></div><input class="toggle" type="checkbox"></div><div class="row"><div><strong>Tracking protection</strong><small>Preference saved; full network-level blocking is not yet available</small></div><input class="toggle" type="checkbox" checked></div><div class="row"><div><strong>HTTPS preference</strong><small>Prefer secure HTTPS addresses</small></div><input class="toggle" type="checkbox"></div>',
extensions:'<p class="note">The extension manager will be added after the core browser controls are restored.</p>'};showPanel(section==='main'?'Settings':section[0].toUpperCase()+section.slice(1),menus[section]);panel.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>showSettings(b.dataset.section))}
document.getElementById('go').onclick=navigate;input.addEventListener('keydown',e=>{if(e.key==='Enter')navigate()});
document.getElementById('back').onclick=()=>{if(view.canGoBack())view.goBack()};document.getElementById('forward').onclick=()=>{if(view.canGoForward())view.goForward()};
document.getElementById('reload').onclick=()=>view.reload();document.getElementById('home').onclick=home;document.getElementById('savedBtn').onclick=()=>{if(view.style.display==='block'&&view.src&&view.src!=='about:blank'){const current=view.src;if(!saved.some(x=>x.url===current)){saved.unshift({url:current,title:new URL(current).hostname});localStorage.setItem('veyra:saved',JSON.stringify(saved));}showSaved()}else showSaved()};document.getElementById('settingsBtn').onclick=()=>showSettings();
view.addEventListener('did-navigate',e=>{input.value=e.url;status.textContent=e.url});view.addEventListener('did-fail-load',e=>{if(e.errorCode!==-3)status.textContent='Could not load page: '+e.errorDescription});
document.getElementById('savedBtn').title='Save current page or open saved pages';
</script></body></html>
