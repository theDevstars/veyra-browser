<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veyra Browser</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10101a;color:#f7f5ff;font:14px Inter,Segoe UI,sans-serif;height:100vh;display:flex;flex-direction:column}
.top{height:64px;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid #302c45;background:#171525}
.brand{font-size:21px;font-weight:800;letter-spacing:.5px;margin-right:10px}.brand span{color:#9b8cff}
button{border:0;background:#28253a;color:#eee;border-radius:10px;padding:10px 13px;cursor:pointer}button:hover{background:#393451}
.address{flex:1;display:flex;background:#242238;border:1px solid #494365;border-radius:14px;padding:4px;gap:6px}.address input{flex:1;min-width:80px;background:transparent;border:0;outline:0;color:white;padding:8px 10px;font-size:14px}
#go{background:#7665ed;font-weight:700;padding:9px 18px}.start{flex:1;display:grid;place-items:center;text-align:center}.welcome h1{font-size:44px;margin:0 0 12px}.welcome p{color:#aaa5c2;font-size:16px}.tiles{display:flex;gap:12px;justify-content:center;margin-top:28px}.tile{padding:18px 22px;border:1px solid #39344f;border-radius:16px;background:#1b192b;color:#c9c3e4}
#view{flex:1;display:none;border:0;background:white;width:100%;height:100%}.status{height:26px;padding:5px 14px;color:#77728e;font-size:11px;border-top:1px solid #302c45}
</style></head><body>
<div class="top"><div class="brand">Veyra<span>.</span></div><button id="back" title="Back">←</button><button id="forward" title="Forward">→</button><button id="reload" title="Reload">↻</button>
<div class="address"><input id="url" placeholder="Search or enter a website address" autocomplete="off" spellcheck="false"><button id="go">Go</button></div><button id="home" title="Home">⌂</button></div>
<div class="start" id="start"><div class="welcome"><h1>Browse your way.</h1><p>A cleaner space for the things you do online.</p><div class="tiles"><div class="tile">Private by design</div><div class="tile">Your web, your way</div><div class="tile">Veyra Browser</div></div></div></div>
<webview id="view" partition="persist:veyra" allowpopups></webview><div class="status" id="status">Veyra Browser · Windows desktop</div>
<script>
const view=document.getElementById('view'),start=document.getElementById('start'),input=document.getElementById('url'),status=document.getElementById('status');
function navigate(){let v=input.value.trim();if(!v)return;let target=/^https?:\/\//i.test(v)?v:/^[^\s.]+$/.test(v)?'https://www.google.com/search?q='+encodeURIComponent(v):'https://'+v;start.style.display='none';view.style.display='block';view.src=target;status.textContent='Loading '+target}
document.getElementById('go').onclick=navigate;input.addEventListener('keydown',e=>{if(e.key==='Enter')navigate()});
document.getElementById('back').onclick=()=>{if(view.canGoBack())view.goBack()};document.getElementById('forward').onclick=()=>{if(view.canGoForward())view.goForward()};
document.getElementById('reload').onclick=()=>view.reload();document.getElementById('home').onclick=()=>{view.src='about:blank';view.style.display='none';start.style.display='grid';input.value='';status.textContent='Veyra Browser · Windows desktop'};
view.addEventListener('did-navigate',e=>{input.value=e.url;status.textContent=e.url});view.addEventListener('did-fail-load',e=>{if(e.errorCode!==-3)status.textContent='Could not load page: '+e.errorDescription});
</script></body></html>
