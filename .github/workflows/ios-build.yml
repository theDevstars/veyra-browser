name: Veyra multi-platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veyra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web export (Windows, macOS, Linux, mobile browsers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx expo export --platform web
      - uses: actions/upload-artifact@v4
        with:
          name: veyra-web
          path: dist/
          if-no-files-found: error

  android:
    name: Android validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx expo export --platform android

  ios:
    name: iOS validation and unsigned archive
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Export iOS bundle
        run: npx expo export --platform ios
      - name: Find Xcode project
        id: project
        shell: bash
        run: |
          PROJECT="$(find . -maxdepth 5 -name '*.xcworkspace' -not -path '*/Pods/*' -print -quit)"
          if [ -n "$PROJECT" ]; then
            echo "kind=workspace" >> "$GITHUB_OUTPUT"
            echo "path=$PROJECT" >> "$GITHUB_OUTPUT"
          else
            PROJECT="$(find . -maxdepth 5 -name '*.xcodeproj' -not -path '*/Pods/*' -print -quit)"
            if [ -n "$PROJECT" ]; then
              echo "kind=project" >> "$GITHUB_OUTPUT"
              echo "path=$PROJECT" >> "$GITHUB_OUTPUT"
            else
              echo "found=false" >> "$GITHUB_OUTPUT"
              echo "No native Xcode project committed; Expo iOS export passed, skipping IPA archive."
              exit 0
            fi
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
      - name: Archive iOS app without signing
        if: steps.project.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.project.outputs.kind }}" = "workspace" ]; then
            xcodebuild -workspace "${{ steps.project.outputs.path }}" -scheme Veyra -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Veyra.xcarchive" CODE_SIGNING_ALLOWED=NO archive
          else
            xcodebuild -project "${{ steps.project.outputs.path }}" -scheme Veyra -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Veyra.xcarchive" CODE_SIGNING_ALLOWED=NO archive
          fi
