name: Build Veyra IPA, APK and EXE

concurrency:
  group: veyra-build-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app.json"
      - "App.js"
      - "assets/veyra-icon.svg"
      - "desktop/index.html"
      - "desktop/main.js"
      - "desktop/package.json"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS IPA (unsigned)
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Generate Veyra app icon
        run: |
          npm install --no-save sharp
          node -e "require('sharp')('assets/veyra-icon.svg').resize(1024,1024).png().toFile('assets/icon.png')"
      - name: Set native app version for this build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          node -e "const fs=require('fs'); const p='app.json'; const config=JSON.parse(fs.readFileSync(p,'utf8')); const build=process.env.BUILD_NUMBER; config.expo.icon='./assets/icon.png'; config.expo.version='1.0.'+build; config.expo.ios={...config.expo.ios,buildNumber:build}; config.expo.android={...config.expo.android,versionCode:Number(build)}; fs.writeFileSync(p,JSON.stringify(config,null,2)+'\\n');"
      - name: Generate iOS project
        run: npx expo prebuild --platform ios --non-interactive --no-install
      - name: Install CocoaPods dependencies
        working-directory: ios
        timeout-minutes: 12
        run: pod install
      - name: Build iOS app
        run: |
          cd ios
          WORKSPACE=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)
          if [ -z "$WORKSPACE" ]; then echo "No Xcode workspace found"; ls -la; exit 1; fi
          SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);const w=Object.values(j).find(v=>v&&v.schemes);if(!w||!w.schemes.length)process.exit(2);const schemes=w.schemes;const app=schemes.find(s=>s==='Veyra')||schemes.find(s=>s==='Veyra Browser')||schemes.find(s=>!/(^Pods$|^Expo|^EX|^React|^hermes)/i.test(s));if(!app){console.error('No app scheme found:',schemes.join(', '));process.exit(3)}console.log(app)})")
          echo "Building Xcode workspace: $WORKSPACE"
          echo "Using Xcode scheme: $SCHEME"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          echo "Searching for the built iOS app bundle..."
          APP_PATH=$(find ios -type d -name '*.app' -not -path '*/Index.noindex/*' -not -path '*/Pods/*' -print -quit 2>/dev/null || true)
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: No .app bundle was found. Xcode build products:"
            find . -type d -name '*.app' -not -path '*/Index.noindex/*' -not -path '*/Pods/*' -not -path './node_modules/*' -not -path './.git/*' -print 2>/dev/null | head -100 || true
            echo "Relevant build directories:"
            find ios -maxdepth 7 -type d \( -name Products -o -name Release-iphoneos -o -name build \) 2>/dev/null | head -100 || true
            exit 1
          fi
          echo "Packaging app bundle: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Veyra-unsigned.ipa Payload
          test -s Veyra-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Veyra-unsigned-IPA
          path: Veyra-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Generate Veyra app icon
        run: |
          npm install --no-save sharp
          node -e "require('sharp')('assets/veyra-icon.svg').resize(1024,1024).png().toFile('assets/icon.png')"
      - name: Set native app version for this build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          node -e "const fs=require('fs'); const p='app.json'; const config=JSON.parse(fs.readFileSync(p,'utf8')); const build=process.env.BUILD_NUMBER; config.expo.icon='./assets/icon.png'; config.expo.version='1.0.'+build; config.expo.ios={...config.expo.ios,buildNumber:build}; config.expo.android={...config.expo.android,versionCode:Number(build)}; fs.writeFileSync(p,JSON.stringify(config,null,2)+'\\n');"
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Veyra-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Set Windows installer version
        working-directory: desktop
        env:
          RELEASE_VERSION: 1.0.${{ github.run_number }}
        run: node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.version=process.env.RELEASE_VERSION; fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
      - name: Package Windows installer
        working-directory: desktop
        run: npm run dist
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Veyra-Windows-EXE
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 7

  create-release:
    name: Publish release with all builds
    runs-on: ubuntu-latest
    needs: [build-ios, build-android, build-windows]
    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: Veyra-unsigned-IPA
          path: release-files
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Veyra-APK
          path: release-files
      - name: Download Windows EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: Veyra-Windows-EXE
          path: release-files
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: veyra-v1.0.${{ github.run_number }}
          name: Veyra Browser v1.0.${{ github.run_number }}
          body: |
            Veyra Browser cross-platform release.

            Assets:
            - Android APK: intended for Android devices.
            - Windows EXE installer: Veyra Browser desktop app.
            - iOS IPA: unsigned build; standard iPhone installation requires signing through SideStore or another compatible signing method.
          prerelease: false
          make_latest: true
          files: release-files/*
      - name: Update Veyra SideStore source
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_TAG: veyra-v1.0.${{ github.run_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          CURRENT_BUILD=$(gh api "repos/$REPOSITORY/contents/sidestore-source.json" --jq .content | base64 -d | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);console.log(j.apps?.[0]?.versions?.[0]?.buildVersion||0)}catch{console.log(0)}})")
          if [ "$CURRENT_BUILD" -gt "$BUILD_NUMBER" ]; then echo "A newer source is already published; keeping it."; exit 0; fi
          IPA_SIZE=$(stat -c%s release-files/Veyra-unsigned.ipa)
          export IPA_SIZE
          node -e "const fs=require('fs');const build=process.env.BUILD_NUMBER;const tag=process.env.RELEASE_TAG;const repo=process.env.REPOSITORY;const root='https://raw.githubusercontent.com/'+repo+'/main/assets/veyra-icon.svg';const source={name:'Veyra Browser',subtitle:'A customizable browser for your devices',description:'Veyra Browser for iPhone and iPad. Updates are published with each GitHub release.',iconURL:root,website:'https://github.com/'+repo,tintColor:'#7867F7',apps:[{name:'Veyra Browser',bundleIdentifier:'com.thedevstars.veyra',developerName:'theDevstars',subtitle:'A customizable browser for your devices',localizedDescription:'Browse with Veyra Browser, with customizable browsing features and privacy settings.',iconURL:root,tintColor:'#7867F7',category:'utilities',versions:[{version:'1.0.'+build,buildVersion:build,date:new Date().toISOString(),localizedDescription:'Veyra Browser cross-platform update.',downloadURL:'https://github.com/'+repo+'/releases/download/'+tag+'/Veyra-unsigned.ipa',size:Number(process.env.IPA_SIZE)}],appPermissions:{entitlements:[],privacy:{NSPhotoLibraryUsageDescription:'Choose a wallpaper for Veyra Browser.'}}}],news:[]};fs.writeFileSync('sidestore-source.json',JSON.stringify(source,null,2)+'\\n');"
          FILE_SHA=$(gh api "repos/$REPOSITORY/contents/sidestore-source.json" --jq .sha)
          gh api "repos/$REPOSITORY/contents/sidestore-source.json" --method PUT --field message="Update Veyra SideStore source for $RELEASE_TAG" --field content="$(base64 -w0 sidestore-source.json)" --field sha="$FILE_SHA" --field branch=main
